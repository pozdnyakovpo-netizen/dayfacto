name: publish

on:
  push:
    paths:
      - 'outbox/pending.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Публикация в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TARGET_CHAT: ${{ secrets.TELEGRAM_TARGET_CHAT }}
        run: python tools/publish_outbox.py

      - name: Обновить очередь в репозитории
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add outbox/pending.json outbox/sent.json
          if git diff --cached --quiet; then
            echo "изменений нет"
          else
            git commit -m "publish: очередь обновлена [skip ci]"
            git push
          fi
