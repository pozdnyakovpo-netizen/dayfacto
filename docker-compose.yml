version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dayfacto
      POSTGRES_PASSWORD: dayfacto
      POSTGRES_DB: dayfacto
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Phase 3+ — раскомментировать, когда дойдём до embedding dedup/памяти.
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   restart: unless-stopped
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - qdrant_data:/qdrant/storage

  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.base
    command: alembic upgrade head
    env_file: .env
    depends_on:
      - postgres

  ingestion:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.base
    command: python -m services.ingestion.main
    env_file: .env
    depends_on:
      - postgres
      - redis
      - migrate
    restart: unless-stopped

  dedup:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.base
    command: python -m services.dedup.main
    env_file: .env
    depends_on:
      - postgres
      - migrate
    restart: unless-stopped

  clustering:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.base
    command: python -m services.clustering.main
    env_file: .env
    depends_on:
      - postgres
      - migrate
    restart: unless-stopped

  # Phase 1 продолжение (следующие итерации, скелет уже в project structure):
  # ranking:
  # editorial:
  # decision:
  # publisher:

volumes:
  pgdata:
  # qdrant_data:
